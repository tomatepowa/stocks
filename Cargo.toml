[package]
name = "stocks"
version = "0.1.0"
edition = "2021"
description = "Gestion des stocks pharmacie et économat des cliniques"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
deadpool-postgres = "0.14"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-postgres = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
